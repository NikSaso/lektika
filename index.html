<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Λεκτικά — D2D Toolkit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

:root{
  --bg:#f7f6f3;
  --surface:#ffffff;
  --surface2:#f1efec;
  --text:#292630;
  --muted:#89838d;
  --green:#4dbb89;
  --green-dark:#247352;
  --red:#e97878;
  --red-dark:#a94747;
  --yellow:#f3c65c;
  --purple:#6258c9;
  --dark:#302d3a;
  --border:#ebe8e4;
  --shadow:0 8px 28px rgba(35,31,42,.06);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
  transition:.25s;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:90px;
}


/* =========================
   HEADER
========================= */

.header{
  max-width:760px;
  margin:auto;

  padding:22px 18px 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand-small{
  font-size:9px;
  font-weight:800;
  letter-spacing:2px;
  color:var(--muted);
}

.brand{
  margin-top:1px;

  font-family:"Baloo 2",sans-serif;
  font-size:38px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1px;
}

.brand span{
  color:#ff7858;
}

.theme{
  width:44px;
  height:44px;

  border-radius:15px;

  background:var(--surface);
  color:var(--text);

  box-shadow:var(--shadow);

  font-size:19px;

  transition:.2s;
}

.theme:active{
  transform:scale(.92);
}


/* =========================
   HERO
========================= */

.hero{
  max-width:760px;
  margin:8px auto 0;

  padding:28px 20px 22px;

  border-radius:30px;

  color:white;

  background:
    radial-gradient(
      circle at 100% 0%,
      #ff9574 0,
      #ff9574 12%,
      transparent 35%
    ),
    radial-gradient(
      circle at 0% 100%,
      #6e65d8 0,
      #6e65d8 11%,
      transparent 34%
    ),
    #302d3a;
}

.hero-kicker{
  display:inline-flex;

  padding:7px 11px;

  border-radius:50px;

  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.13);

  font-size:9px;
  font-weight:700;
}

.hero h1{
  margin:20px 0 10px;

  font-family:"Baloo 2",sans-serif;

  font-size:39px;
  line-height:.96;
  letter-spacing:-1px;
}

.hero h1 span{
  color:#ffd56a;
}

.hero p{
  margin:0;

  max-width:510px;

  color:#ded9e5;

  font-size:12px;
  line-height:1.55;
}


/* =========================
   SEARCH
========================= */

.search{
  margin-top:20px;

  display:flex;
  align-items:center;

  background:white;

  border-radius:17px;

  box-shadow:0 12px 28px rgba(0,0,0,.16);

  overflow:hidden;
}

.search-icon{
  padding-left:15px;

  color:#98919c;

  font-size:23px;
}

.search input{
  width:100%;

  padding:16px 13px;

  border:0;
  outline:0;

  color:#292630;
  background:transparent;

  font-size:13px;
}

.search input::placeholder{
  color:#aaa4ac;
}


/* =========================
   QUICK LINKS
========================= */

.quick{
  max-width:760px;
  margin:14px auto 0;

  display:grid;
  grid-template-columns:1fr 1fr 1fr;

  gap:8px;
}

.quick button{
  min-height:70px;

  padding:11px 8px;

  border-radius:18px;

  background:var(--surface);

  box-shadow:var(--shadow);

  color:var(--text);

  transition:.2s;
}

.quick button:active{
  transform:scale(.97);
}

.quick-icon{
  display:block;
  margin-bottom:4px;
  font-size:20px;
}

.quick-label{
  font-size:10px;
  font-weight:700;
}


/* =========================
   MAIN
========================= */

main{
  max-width:760px;
  margin:auto;
}

.section{
  margin-top:34px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;

  padding:0 4px;

  margin-bottom:13px;
}

.section-head h2{
  margin:0;

  font-family:"Baloo 2",sans-serif;

  font-size:27px;
  line-height:1;
}

.section-head p{
  margin:0;

  color:var(--muted);

  font-size:9px;
  font-weight:700;
}


/* =========================
   INTRO
========================= */

.intro{
  margin:22px 4px 0;

  color:var(--muted);

  font-size:12px;
  line-height:1.55;
}


/* =========================
   GROUP
========================= */

.group{
  margin-top:20px;
}

.group-title{
  display:flex;
  align-items:center;
  gap:8px;

  margin:0 4px 9px;

  color:#77717c;

  font-size:10px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.7px;
}

.group-title:before{
  content:"";

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--green);
}


/* =========================
   PHRASE
========================= */

.phrases{
  display:grid;
  gap:8px;
}

.phrase{
  position:relative;

  min-height:63px;

  padding:15px 58px 15px 17px;

  display:flex;
  align-items:center;

  background:var(--surface);

  border-radius:17px;

  border:1px solid var(--border);

  box-shadow:0 4px 14px rgba(30,25,38,.035);

  transition:
    transform .18s,
    box-shadow .18s;
}

.phrase:active{
  transform:scale(.985);
}

.phrase p{
  margin:0;

  font-size:13px;
  line-height:1.45;
  font-weight:600;
}

.phrase.negative{
  border-left:4px solid var(--red);
}

.phrase.positive{
  border-left:4px solid var(--green);
}

.copy{
  position:absolute;

  right:10px;
  top:50%;

  width:35px;
  height:35px;

  transform:translateY(-50%);

  border-radius:11px;

  background:var(--surface2);

  color:#77717d;

  font-size:16px;

  transition:.18s;
}

.copy:active{
  transform:translateY(-50%) scale(.88);
}


/* =========================
   EXAMPLE
========================= */

.example{
  margin-top:9px;

  padding:16px;

  border-radius:18px;

  background:#fff5d9;

  border:1px solid #f1daa1;
}

.example-label{
  color:#9d6e0b;

  font-size:9px;
  font-weight:800;

  letter-spacing:.8px;
  text-transform:uppercase;
}

.example p{
  margin:7px 0 0;

  font-family:"Baloo 2",sans-serif;

  font-size:17px;
  line-height:1.35;
}


/* =========================
   BETTER
========================= */

.better{
  margin-top:12px;
}

.better-title{
  margin:0 4px 8px;

  color:var(--green-dark);

  font-size:9px;
  font-weight:800;

  letter-spacing:.8px;
  text-transform:uppercase;
}


/* =========================
   SWAPS
========================= */

.swap{
  margin-bottom:9px;

  padding:15px 16px;

  border-radius:18px;

  background:var(--surface);

  border:1px solid var(--border);

  box-shadow:0 4px 14px rgba(30,25,38,.035);
}

.swap-row{
  font-size:13px;
  line-height:1.4;
}

.swap-row.bad{
  color:var(--red-dark);
}

.swap-row.good{
  color:var(--green-dark);
}

.swap-label{
  display:block;

  margin-bottom:4px;

  font-size:8px;
  font-weight:800;

  letter-spacing:1px;
  text-transform:uppercase;

  opacity:.65;
}

.swap-arrow{
  margin:6px 0;

  color:#aaa3ad;

  text-align:center;
}


/* =========================
   GOLD
========================= */

.gold{
  position:relative;

  margin-bottom:10px;

  padding:18px 17px;

  border-radius:21px;

  background:
    linear-gradient(
      135deg,
      #302d3a,
      #484253
    );

  color:white;

  box-shadow:0 8px 22px rgba(34,30,40,.11);
}

.gold:after{
  content:"✦";

  position:absolute;

  right:15px;
  top:10px;

  color:#ffd66c;

  font-size:22px;
  opacity:.7;
}

.gold-label{
  color:#ffd66c;

  font-size:9px;
  font-weight:800;

  letter-spacing:1px;

  text-transform:uppercase;
}

.gold p{
  margin:8px 25px 0 0;

  font-family:"Baloo 2",sans-serif;

  font-size:18px;
  line-height:1.35;
}


/* =========================
   RANDOM
========================= */

.random{
  max-width:760px;

  margin:15px auto 0;

  padding:18px;

  border-radius:20px;

  background:#fff4d5;

  border:1px solid #efd699;

  animation:slideIn .25s ease;
}

.random-label{
  color:#9c6b08;

  font-size:9px;
  font-weight:800;

  letter-spacing:1px;
  text-transform:uppercase;
}

.random p{
  margin:7px 0 0;

  font-family:"Baloo 2",sans-serif;

  font-size:20px;
  line-height:1.3;
}


/* =========================
   SEARCH RESULTS
========================= */

.results{
  margin-top:30px;
}

.no-results{
  padding:35px 20px;

  text-align:center;

  color:var(--muted);

  font-size:12px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  max-width:760px;

  margin:auto;

  padding:
    7px
    7px
    calc(7px + env(safe-area-inset-bottom));

  display:grid;
  grid-template-columns:repeat(4,1fr);

  background:rgba(255,255,255,.93);

  backdrop-filter:blur(18px);

  border-top:1px solid var(--border);
}

.nav{
  padding:7px 3px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:2px;

  background:transparent;

  color:#aaa4ad;

  font-size:19px;
}

.nav small{
  font-size:8px;
  font-weight:700;
}

.nav.active{
  color:var(--dark);
}


/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:82px;

  z-index:100;

  padding:10px 15px;

  border-radius:13px;

  background:#292630;

  color:white;

  font-size:11px;
  font-weight:700;

  opacity:0;

  pointer-events:none;

  transform:translate(-50%,15px);

  transition:.25s;
}

.toast.show{
  opacity:1;

  transform:translate(-50%,0);
}


/* =========================
   ANIMATION
========================= */

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* =========================
   DARK
========================= */

body.dark{
  --bg:#18171c;
  --surface:#28252d;
  --surface2:#35313b;
  --text:#eeeaf0;
  --muted:#aaa3ae;
  --border:#39353e;
}

body.dark .search{
  background:#29262f;
}

body.dark .search input{
  color:white;
}

body.dark .bottom{
  background:rgba(35,32,41,.94);
}

body.dark .nav.active{
  color:white;
}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  .hero,
  .quick,
  .random{
    margin-left:20px;
    margin-right:20px;
  }

  main{
    padding:0 20px;
  }

  .phrases{
    grid-template-columns:1fr 1fr;
  }

  .bottom{
    border-radius:22px 22px 0 0;
  }

}

</style>
</head>

</nav>


<div
  id="toast"
  class="toast"
></div>

/* =========================
   HELPERS
========================= */

const content =
document.getElementById("content");

const search =
document.getElementById("search");

const toast =
document.getElementById("toast");

const randomBox =
document.getElementById("randomBox");


function esc(text){

return text.replace(
/[&<>"']/g,
char=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[char])
);

}


/* =========================
   PHRASE
========================= */

function phrase(text,type){

return `

<div class="phrase ${type}">

<p>
${esc(text)}
</p>

<button
class="copy"
data-copy="${esc(text)}"
>
⧉
</button>

</div>

`;

}

Απόφυγε φράσεις που δημιουργούν πίεση,
υπερβολή ή κάνουν τον πελάτη να θέλει
να τελειώσει γρήγορα τη συζήτηση.
</p>

${data.negative.map(group=>`

<div class="group">

<div class="group-title">
${esc(group.title)}
</div>

<div class="phrases">

${group.items
.map(item=>phrase(item,"negative"))
.join("")}

</div>

${group.better?`

<div class="better">

<div class="better-title">
✨ Πες καλύτερα
</div>

<div class="phrases">

${group.better
.map(item=>phrase(item,"positive"))
.join("")}

</div>

</div>

`:""}

</div>

</section>

${renderGold()}

/* =========================
   LIST MODE
========================= */

/* =========================
   MODE
========================= */

function showMode(mode){

document
.querySelectorAll(".nav")
.forEach(nav=>{

nav.classList.toggle(
"active",
nav.dataset.mode===mode
);

});

randomBox.style.display="none";

if(mode==="home"){

renderHome();

}else{

renderList(mode);

}

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   RANDOM
========================= */

function randomPhrase(){

const phrases=[

...data.positive.flatMap(
g=>g.items
),

...data.swap.map(
p=>p[1]
),

...data.gold.map(
g=>g[1]
)

];

const result=
phrases[
Math.floor(
Math.random()*phrases.length
)
];

randomBox.innerHTML=`

<div class="random-label">
🎲 Τυχαίο λεκτικό
</div>

<p>
“${esc(result)}”
</p>

`;

randomBox.style.display="block";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   COPY
========================= */

document.addEventListener(
"click",
event=>{

const button=
event.target.closest("[data-copy]");

if(!button) return;

const text=
button.getAttribute("data-copy");

navigator.clipboard
?.writeText(text);

showToast("✓ Αντιγράφηκε!");

}
);


/* =========================
   NAV
========================= */

document
.querySelectorAll(".nav")
.forEach(nav=>{

nav.addEventListener(
"click",
()=>showMode(
nav.dataset.mode
)
);

});


/* =========================
   SEARCH
========================= */

search.addEventListener(
"input",
()=>{

const q=
search.value
.trim()
.toLowerCase();

if(!q){

renderHome();

return;

}

const results=[];


/* Positive */

data.positive.forEach(group=>{

group.items.forEach(text=>{

if(text.toLowerCase().includes(q)){

results.push({
text,
type:"positive"
});

}

});

});


/* Negative */

data.negative.forEach(group=>{

group.items.forEach(text=>{

if(text.toLowerCase().includes(q)){

results.push({
text,
type:"negative"
});

}

});

if(group.better){

group.better.forEach(text=>{

if(text.toLowerCase().includes(q)){

results.push({
text,
type:"positive"
});

}

});

}

});


/* Swap */

data.swap.forEach(pair=>{

pair.forEach((text,index)=>{

if(text.toLowerCase().includes(q)){

results.push({
text,
type:index===0
?"negative"
:"positive"
});

}

});

});


/* Render */

content.innerHTML=`

<section class="results section">

<div class="section-head">

<h2>
🔎 Αποτελέσματα
</h2>

<p>
${results.length} ΛΕΚΤΙΚΑ
</p>

</div>

${
results.length

?

`<div class="phrases">

${results
.map(r=>phrase(r.text,r.type))
.join("")}

</div>`

:

`

<div class="no-results">

Δεν βρέθηκε κάποιο λεκτικό.<br>
Δοκίμασε άλλη λέξη.

</div>

`

}

</section>

`;

}
);


/* =========================
   TOAST
========================= */

function showToast(message){

toast.textContent=message;

toast.classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer=
setTimeout(
()=>{
toast.classList.remove("show");
},
1500
);

}


/* =========================
   DARK MODE
========================= */

document
.getElementById("themeBtn")
.addEventListener(
"click",
()=>{

document.body
.classList.toggle("dark");

const dark=
document.body
.classList.contains("dark");

document
.getElementById("themeBtn")
.textContent=
dark?"☀":"☾";

}
);


/* =========================
   START
========================= */

renderHome();

</script>

</html>
